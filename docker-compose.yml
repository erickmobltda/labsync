version: "3.8"

# LabSync — local self-hosted stack (no Supabase required)
#
# Usage:
#   cp .env.example .env          # copy the example env file
#   # Set ANTHROPIC_API_KEY in .env
#   docker compose up --build
#
# The app will be available at http://localhost:3000

services:
  # ── Backend API (Express + SQLite) ──────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Please set ANTHROPIC_API_KEY in your .env file}
      JWT_SECRET: ${JWT_SECRET:-change-me-use-a-long-random-string-in-production}
      NODE_ENV: production
      PORT: 3001
      DB_PATH: /data/labsync.db
      UPLOADS_DIR: /data/uploads
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - labsync_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend (Nginx + built React app) ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_MODE: local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  labsync_data:
    driver: local
